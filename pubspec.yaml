name: focus_lock
description: FocusLock productivity app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  intl: ^0.19.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  google_sign_in: ^6.2.2
  google_fonts: ^6.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/focuslock_icon_1024.png"

flutter_native_splash:
  color: "#0F1115"
  image: assets/splash_logo.png
  android_12:
    color: "#0F1115"
    image: assets/splash_logo.png